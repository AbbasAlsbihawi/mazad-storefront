<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>لا يوجد اتصال — مزاد</title>
    <!--
      Standalone by necessity: this page is served by the service worker when the network is
      unreachable, so it cannot depend on the app's stylesheet, its webfont, or the persisted
      theme in localStorage. Colours are the design tokens written as hex, following the device
      theme instead of the app's own toggle.
    -->
    <style>
      :root {
        color-scheme: light dark;
        --background: #f6f7f9;
        --surface: #ffffff;
        --foreground: #14161f;
        --muted: #8e909c;
        --primary: #678af5;
        --border: rgb(20 22 31 / 10%);
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --background: #040405;
          --surface: #26272c;
          --foreground: #f9f9fb;
          --muted: #96979f;
          --primary: #8ba6f8;
          --border: rgb(255 255 255 / 14%);
        }
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: var(--background);
        color: var(--foreground);
        font-family:
          'Cairo',
          ui-sans-serif,
          system-ui,
          -apple-system,
          'Noto Sans Arabic',
          Arial,
          sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      main {
        width: 100%;
        max-width: 22rem;
        padding: 32px 24px;
        border: 1px solid var(--border);
        border-radius: 24px;
        background: var(--surface);
        text-align: center;
      }

      .mark {
        width: 56px;
        height: 56px;
        margin: 0 auto 20px;
        border-radius: 18px;
        background: var(--primary);
        display: flex;
        align-items: center;
        justify-content: center;
      }

      h1 {
        margin: 0 0 8px;
        font-size: 22px;
        line-height: 1.3;
        letter-spacing: -0.4px;
      }

      p {
        margin: 0 0 24px;
        font-size: 15px;
        line-height: 1.5;
        color: var(--muted);
      }

      button {
        width: 100%;
        min-height: 44px;
        padding: 0 20px;
        border: 0;
        border-radius: 999px;
        background: var(--primary);
        color: #ffffff;
        font: inherit;
        font-size: 17px;
        font-weight: 600;
        cursor: pointer;
      }

      button:active {
        opacity: 0.72;
      }

      @media (prefers-color-scheme: dark) {
        button {
          color: #101b33;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="mark">
        <svg
          width="32"
          height="32"
          viewBox="0 0 64 64"
          fill="none"
          stroke="#ffffff"
          stroke-width="8"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <circle cx="42" cy="30" r="12" />
          <path d="M30 42H14" />
        </svg>
      </div>
      <h1>لا يوجد اتصال بالإنترنت</h1>
      <!-- Says plainly that bids and prices are unavailable: an auction app going quiet is not
           the same as a page failing to load, and the difference matters to a bidder. -->
      <p>تعذّر تحميل المزادات. أسعار المزايدات تتغيّر لحظيًا، لذلك لا نعرض نسخة محفوظة.</p>
      <button type="button" onclick="location.reload()">إعادة المحاولة</button>
    </main>
  </body>
</html>
